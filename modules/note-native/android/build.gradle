plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notenative'
version = '0.2.1'

android {
  namespace "expo.modules.notenative"
  defaultConfig {
    versionCode 3
    versionName "0.2.1"
  }
  compileOptions {
    // NewPipeExtractor uses java.time (API 26+). App minSdk 24 needs desugar.
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
  lintOptions {
    abortOnError false
  }
}

// JitPack is added in settings.gradle via plugins/withJitpack.js
// (content filter for com.github.TeamNewPipe only).

dependencies {
  // Match working NOTE app — v0.24.3 is too old for current YouTube.
  implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
