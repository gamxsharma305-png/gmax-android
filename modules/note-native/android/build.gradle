plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notenative'
version = '0.1.0'

android {
  namespace "expo.modules.notenative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // No NewPipe / JitPack — keeps EAS Gradle resolution healthy on SDK 57.
}
