plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notenative'
version = '0.2.0'

android {
  namespace "expo.modules.notenative"
  defaultConfig {
    versionCode 2
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  // Native YouTube stream extraction (no JS runtime)
  implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.24.3")
  implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
