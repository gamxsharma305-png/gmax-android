plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notenative'
version = '0.2.0'

android {
  namespace "expo.modules.notenative"
  defaultConfig {
    versionCode 2
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

// Do NOT declare project-level repositories here.
// Gradle 9 PREFER_SETTINGS ignores them and they conflict with settings.gradle.
// JitPack is added ONLY in settings.gradle via plugins/withJitpack.js
// with content filter for com.github.TeamNewPipe*.

dependencies {
  // Native YouTube stream extraction (resolved via settings.gradle JitPack filter)
  implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.24.3")
  // OkHttp from Maven Central (not JitPack)
  implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
